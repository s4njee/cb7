apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cb8

resources:
  - ../../postgres.yaml
  - ../../cb8.yaml
  - ../../worker.yaml
  - web-uploads-pvc.yaml
  - reader.yaml
  - ingress.yaml
  - admin-ingress.yaml
  - admin-middleware.yaml

patches:
  - path: patch-postgres.yaml
  - path: patch-cb8.yaml
  - path: patch-worker.yaml
  - path: patch-cb8-service.yaml

images:
  - name: registry.s8njee.com/cb8
    newTag: "20260818-163000"
  - name: registry.s8njee.com/cb8-reader
    newTag: "20260818-165500"
