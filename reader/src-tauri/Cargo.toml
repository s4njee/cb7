[package]
name = "reader"
version = "0.1.0"
description = "CB8 — local-first ebook & comic reader"
authors = ["cb7"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "cookies",
    "gzip",
    "brotli",
    "stream",
] }
futures-util = "0.3"
reqwest_cookie_store = "0.8"
cookie_store = { version = "0.21", features = ["serde_json"] }
tokio = { version = "1", features = ["sync", "fs", "io-util"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
url = "2"
log = "0.4"
tauri-plugin-log = "2"
mdns-sd = "0.20.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2.7.2"

# Camera scanning and haptics only exist on phones; keeping them off desktop
# avoids pulling unusable native dependencies into the dev vehicle.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-haptics = "2"

# Desktop-only: Windows/Linux deliver "Open with CB8" via argv, and
# single-instance support forwards later double-clicks to the first process.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# Desktop-only: local CBR (RAR) reading. `unrar` is an MIT/Apache wrapper around
# RARLAB's UnRAR C library, whose freeware license permits use in any software
# to handle RAR archives and redistribution inside other packages — no sidecar,
# no shell, just a page list + on-demand entry read. Mobile keeps its existing
# "CBR needs a server" behavior so phone bundles don't grow.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
unrar = "0.5.8"
# Desktop-only: persist window size/position/maximized across launches and
# clamp restored geometry to a connected monitor.
tauri-plugin-window-state = "2.4.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
