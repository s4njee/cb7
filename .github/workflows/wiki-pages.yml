name: Publish CB8 wiki

on:
  push:
    branches: [main]
    paths:
      - 'server/packaging/wiki-nextra/**'
      - 'server/packaging/wiki/content/**'
      - 'server/docs/**'
      - 'reader/docs/**'
      - 'reader/README.md'
      - 'reader/plan-desktop-v2.md'
      - '.github/workflows/wiki-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/packaging/wiki-nextra
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: server/packaging/wiki-nextra/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Build static site
        run: pnpm build
        env:
          PAGES_BASE_PATH: /cb7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: server/packaging/wiki-nextra/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
